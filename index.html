<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>relpmas</title>
    <link rel="stylesheet" href="/src/main.css" />
  </head>
  <body>
    <h1>relpmas</h1>
    <div id="unlock"></div>
    <div id="app" class="app-layout" hidden>
      <div id="record-widget" class="record-widget">
        <span id="record-idle-label" class="record-idle-label">Record</span>
        <span id="record-elapsed" class="record-elapsed" hidden></span>
        <a
          id="download-link"
          class="record-download-link"
          hidden
          download
        ></a>
        <button
          id="record-toggle-button"
          class="record-toggle-button"
          title="Record"
        ></button>
      </div>
      <div class="app-main">
        <section class="panel">
          <h2>Source</h2>
          <p><input type="file" id="file-input" accept="audio/*" /></p>
          <div id="waveform"></div>
        </section>

        <section class="panel">
          <div class="section-header-row">
            <h2>Nodes</h2>
            <div class="node-toolbar">
              <button id="add-node" class="icon-button" title="Add node">
                +
              </button>
              <button
                id="duplicate-node"
                class="icon-button"
                title="Duplicate selected"
              >
                ⎘
              </button>
              <button
                id="remove-node"
                class="icon-button"
                title="Remove selected"
              >
                ×
              </button>
              <button
                id="fire-node"
                class="icon-button"
                title="Fire (immediate)"
              >
                ▶
              </button>
              <button
                id="trigger-node"
                class="icon-button"
                title="Trigger (pattern)"
              >
                ⟳
              </button>
            </div>
          </div>
          <div id="patch-graph"></div>
        </section>

        <section class="panel">
          <h2>Master bus</h2>
          <div id="master-effects"></div>
          <p class="app-note">
            If audio ever goes silent and stays silent (a feedback
            effect or extreme modulation setting can occasionally get
            stuck), try this before reloading -- reloading loses the
            whole patch, this doesn't.
          </p>
          <div class="node-toolbar">
            <button id="reset-audio-button">Reset audio</button>
          </div>
        </section>
      </div>

      <aside id="node-menu-panel" class="node-menu-panel" hidden></aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
